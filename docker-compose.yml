services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdtracker
      POSTGRES_USER: gdtracker
      POSTGRES_PASSWORD: gdtracker
    ports:
      - "5432:5432"
    volumes:
      - gdtracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gdtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gdtracker
      DB_USERNAME: gdtracker
      DB_PASSWORD: gdtracker
      AREDL_API_KEY: ${AREDL_API_KEY}
      GDDL_API_KEY: ${GDDL_API_KEY}

volumes:
  gdtracker-postgres-data: