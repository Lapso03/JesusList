<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enlaces · GD Progress Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="links-page">

    <div class="marquee">
        <div class="marquee-track">
            <span>SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA ·&nbsp;</span>
            <span>SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA · SE LÍA ·&nbsp;</span>
        </div>
    </div>

    <h1>Enlaces</h1>

    <div class="links-grid">
        <a th:each="link : ${links}" th:href="${link.url}" target="_blank" rel="noopener" class="link-card">
            <span class="nav-emoji" th:text="${link.emoji}"></span>
            <span class="nav-title" th:text="${link.title}"></span>
            <span class="nav-desc" th:text="${link.description}"></span>
        </a>
    </div>

</main>

</body>
</html>
