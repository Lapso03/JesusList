<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GD Progress Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="home-hero">
    <h1>GD Progress Tracker</h1>
    <p class="muted">El progreso de GdLali, Bimba666 y Lapso en las listas del servidor.</p>

    <div class="home-grid">
        <a th:each="entry : ${gameLists}" th:href="@{'/listas/' + ${entry.list.slug}}" class="nav-card">
            <span class="nav-emoji" th:text="${entry.list.emoji}">😈</span>
            <span class="nav-title" th:text="${entry.list.name}">Classic</span>
            <span class="nav-desc" th:text="${entry.levelCount} + ' niveles · ' + ${entry.list.description}">89 niveles</span>
        </a>

        <a th:href="@{/enlaces}" class="nav-card">
            <span class="nav-emoji">🔗</span>
            <span class="nav-title">Enlaces</span>
            <span class="nav-desc">AREDL, GDDL y demás sitios útiles</span>
        </a>

        <a th:href="@{/login}" class="nav-card nav-card-accent">
            <span class="nav-emoji">🔑</span>
            <span class="nav-title">Iniciar sesión</span>
            <span class="nav-desc">Para poder editar tu progreso</span>
        </a>
    </div>
</main>

</body>
</html>
